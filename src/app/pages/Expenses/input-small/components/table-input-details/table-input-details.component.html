<div class="row animated fadeIn fast m-1"
    *ngIf="inputsService.detailShopping().length === 0">
    <div class="col-12">
        <div class="alert alert-info text-center">
            <h5 class="alert-heading">Sin productos</h5>
            <i class="fa fa-spin fa-refresh fa-2x"></i>
            <p class="mb-0">Agrega productos desde el buscador</p>
        </div>
    </div>
</div>
<p-table *ngIf="inputsService.detailShopping().length !== 0" [value]="inputsService.detailShopping()" styleClass="p-datatable-sm app-table-scroll" responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th class="text-white app-u-min-width-120px-651945a app-u-max-width-200px-a828909 background-primary">Producto</th>
            <th class="text-white text-center background-primary">Cantidad</th>
            <th class="text-white text-center background-primary">Costo</th>
            <th class="text-white app-u-min-width-110px-365391b app-u-max-width-150px-7eba571 background-primary">Importe</th>
            <th class="text-white text-center app-u-min-width-60px-71f5ad8 app-u-max-width-60px-d4de838 background-primary">Quitar</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
        <tr>
            <td class="app-u-min-width-120px-651945a app-u-max-width-200px-a828909">
                <h5 class="m-0 p-0">{{product.name}}</h5>
                <p class="text-muted app-u-font-size-10px-0d5be05">{{product.description}} <br *ngIf="product.description"> <span class="text-black">{{product.cod}} / {{product.category.name}} / {{product.unit.name}}</span></p>
            </td>
            <td  class="text-center">
                <p-inputNumber

                    [size]="5"
                    locale="en-US"
                    mode="decimal"
                    [minFractionDigits]="2"
                    [showButtons]="true"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    placeholder="0"
                    [min]="0.1"
                    [max]="99999999999999"
                    [inputId]="product.id"
                    [(ngModel)] = "product.quantity"
                    (onInput)="updateQuantityProduct($event, product)" class="app-u-height-38px-3b84911">
                </p-inputNumber>
            </td>
            <td  class="text-center">
                <p-inputNumber

                    [size]="5"
                    locale="en-US"
                    mode="decimal"
                    [minFractionDigits]="decimalLength()"
                    [maxFractionDigits]="decimalLength()"
                    [showButtons]="true"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    placeholder="0.00"
                    [min]="0"
                    [max]="99999999999999"
                    [inputId]="product.id"
                    [(ngModel)] = "product.costo"
                    (dblclick)="openModalUpdateMontoSus($event,product)"
                    (onInput)="updateCostProduct($event, product)" class="app-u-height-38px-3b84911">
                </p-inputNumber>
            </td>
            <td class="app-u-min-width-110px-365391b app-u-max-width-150px-7eba571">{{ product.import | number: decimal()}}</td>
            <td class="text-center app-u-min-width-60px-71f5ad8 app-u-max-width-60px-d4de838">
                <p-button ariaLabel="Eliminar"
                    (click)="deleteProductForDetailShopping(product.id)"
                    icon="fa-regular fa-trash-can"
                    styleClass="p-button-outlined  p-button-sm p-button-danger p-button-rounded">
                </p-button>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="footer">
        <tr>
            <th colspan="3" class="text-end text-white pt-1 background-primary"><h4>Total: &nbsp;</h4></th>
            <th colspan="2" class="text-start text-white pt-1 background-primary"><h4>{{ totalSummary()  | number:decimal() }}</h4></th>
        </tr>
        <tr>
            <td colspan="5" class="text-end bg-white">
                <p-button
                    (click)="clearDetailShopping()"
                    icon="fa-solid fa-ban"
                    label="Cancelar"
                    styleClass="p-button-sm p-button-rounded p-button-danger">
                </p-button>
                <p-button
                    styleClass="p-button-sm p-button-rounded ms-2"
                    label="Confirmar"
                    (click)="inputsService.showModalSaveInput = true"
                    icon="fa-solid fa-floppy-disk">
                </p-button>
            </td>

        </tr>
    </ng-template>
</p-table>
<app-modal-update-bs-sus [cambio]="this.product_temp()?.costo ?? 0" (onNewBs)="showUpdateBs($event);"></app-modal-update-bs-sus>
