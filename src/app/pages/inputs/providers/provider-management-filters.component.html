<aside class="provider-filter-panel rounded-xl shadow-sm p-3.5 flex flex-col gap-3.5">
  <!-- Filter Header -->
  <div class="provider-filter-heading flex items-center justify-between">
    <div class="flex items-center gap-2 text-erp-text">
      <div class="w-7 h-7 rounded-lg bg-white/20 text-white flex items-center justify-center text-sm font-bold">
        <i class="fa-solid fa-filter"></i>
      </div>
      <h2 class="font-bold text-sm text-white mb-0">Filtros Avanzados</h2>
    </div>
  </div>

  <!-- Error / Loading -->
  <div *ngIf="catalogLoading" class="p-3 text-center text-xs text-erp-text-muted">
    <i class="fa-solid fa-spinner fa-spin mr-1.5 text-erp-success"></i>Cargando filtros del sistema...
  </div>
  <div *ngIf="error" class="p-2 rounded bg-erp-danger-soft text-erp-danger border border-erp-border text-xs flex items-center justify-between">
    <span>{{ error }}</span>
    <button *ngIf="!catalog" type="button" (click)="loadCatalogs()" class="erp-btn btn-xs erp-btn-outline-danger">Reintentar</button>
  </div>

  <!-- Form Body -->
  <form *ngIf="catalog" [formGroup]="form" (ngSubmit)="apply()" class="flex flex-col gap-3">

    <!-- 1. Identificación Rápida -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] uppercase font-bold tracking-wider text-erp-success flex items-center gap-1">
        <i class="fa-solid fa-magnifying-glass text-erp-success"></i> Identificación Rápida
      </label>
      <div class="relative flex items-center">
        <input type="text" formControlName="query" (keyup.enter)="apply()"
          placeholder="Nombre, CI o NIT..."
          class="w-full h-9 px-3 text-xs bg-erp-bg border border-erp-border rounded-lg text-erp-text placeholder-slate-400 focus:bg-white focus:border-emerald-500 focus:outline-none transition-all shadow-inner" />
      </div>
    </div>

    <section class="flex flex-col gap-2 pt-2 border-t border-erp-border" aria-labelledby="provider-commercial-heading">
      <h3 id="provider-commercial-heading" class="text-[11px] uppercase font-bold tracking-wider text-erp-success mb-0">
        <i class="fa-solid fa-id-card mr-1" aria-hidden="true"></i> Perfil comercial
      </h3>
      <div>
        <label for="provider-type" class="text-[11px] text-erp-text-muted block mb-0.5">Tipo de proveedor / Calificación</label>
        <p-dropdown inputId="provider-type" formControlName="id_type_provider" [options]="catalog.types"
          optionLabel="name" optionValue="id" [showClear]="true" placeholder="Todos los tipos"
          (onChange)="typeChanged(); apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
      </div>
      <div *ngIf="corporateVisible()">
        <label for="provider-entity-type" class="text-[11px] text-erp-text-muted block mb-0.5">Tipo de entidad</label>
        <p-dropdown inputId="provider-entity-type" formControlName="entity_type" [options]="entityTypeOptions"
          optionLabel="label" optionValue="value" [showClear]="true" placeholder="Todas las entidades"
          (onChange)="apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
      </div>
      <div>
        <label for="provider-commercial-user" class="text-[11px] text-erp-text-muted block mb-0.5">Responsable comercial</label>
        <p-dropdown inputId="provider-commercial-user" formControlName="id_commercial_user" [options]="userOptions"
          optionLabel="label" optionValue="value" [showClear]="true" [filter]="true" filterBy="label"
          placeholder="Todos los responsables" (onChange)="apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
      </div>
    </section>

    <section class="flex flex-col gap-2 pt-2 border-t border-erp-border" aria-labelledby="provider-location-heading">
      <h3 id="provider-location-heading" class="text-[11px] uppercase font-bold tracking-wider text-erp-success mb-0">
        <i class="fa-solid fa-location-dot mr-1" aria-hidden="true"></i> Ubicación del proveedor
      </h3>
      <div>
        <label for="provider-department" class="text-[11px] text-erp-text-muted block mb-0.5">Departamento</label>
        <p-dropdown inputId="provider-department" formControlName="department" [options]="departmentOptions"
          optionLabel="label" optionValue="value" [showClear]="true" [filter]="true" placeholder="Todos los departamentos"
          (onChange)="departmentChanged()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
      </div>
      <div>
        <label for="provider-city" class="text-[11px] text-erp-text-muted block mb-0.5">Ciudad / Municipio</label>
        <p-dropdown inputId="provider-city" formControlName="city" [options]="filteredCities()"
          optionLabel="label" optionValue="value" [showClear]="true" [filter]="true" placeholder="Todas las ciudades"
          (onChange)="apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
      </div>
    </section>
    <!-- 2. Sucursales y Almacenes -->
    <div class="flex flex-col gap-2 pt-1 border-t border-erp-border">
      <label class="text-[11px] uppercase font-bold tracking-wider text-erp-success flex items-center gap-1">
        <i class="fa-solid fa-building text-erp-success"></i> Sucursales y Almacenes
      </label>
      <div class="flex flex-col gap-1.5">
        <div>
          <span class="text-[11px] text-erp-text-muted block mb-0.5">Sucursales<span class="text-erp-danger">*</span></span>
          <p-multiSelect formControlName="id_sucursal" [options]="branchOptions" optionLabel="name" optionValue="id"
            placeholder="Seleccione sucursales..." appendTo="body"
            [filter]="true" filterBy="name" [showClear]="true" display="chip" styleClass="w-full text-xs"
            (onChange)="onBranchChange()">
          </p-multiSelect>
        </div>
        <div>
          <span class="text-[11px] text-erp-text-muted block mb-0.5">Área / Almacén</span>
          <p-multiSelect formControlName="id_storage" [options]="filteredStorages()" optionLabel="name" optionValue="id"
            placeholder="Seleccione almacenes..." appendTo="body"
            [filter]="true" filterBy="name" [showClear]="true" display="chip" styleClass="w-full text-xs"
            (onChange)="apply()">
          </p-multiSelect>
        </div>
      </div>
    </div>

    <!-- 3. Período Operativo -->
    <div class="flex flex-col gap-2 pt-1 border-t border-erp-border">
      <label class="text-[11px] uppercase font-bold tracking-wider text-erp-success flex items-center gap-1">
        <i class="fa-solid fa-calendar-days text-erp-success"></i> Período Operativo
      </label>
      <div class="flex flex-col gap-1.5">
        <div>
          <span class="text-[11px] text-erp-text-muted block mb-0.5">Rango temporal</span>
          <p-dropdown formControlName="date_mode" [options]="modes" optionLabel="label" optionValue="value"
            (onChange)="dateModeChanged(); apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
        </div>
        <div *ngIf="form.get('date_mode')?.value !== 'ALL'" class="flex flex-col gap-2 mt-0.5">
          <div>
            <span class="text-[11px] text-erp-text-muted block mb-0.5">{{ form.get('date_mode')?.value === 'RANGE' ? 'Desde' : 'Fecha' }}</span>
            <input formControlName="date" [type]="form.get('date_mode')?.value === 'MONTH' ? 'month' : form.get('date_mode')?.value === 'YEAR' ? 'number' : 'date'"
              class="w-full h-8 px-2 text-xs bg-erp-bg border border-erp-border rounded text-erp-text focus:bg-white focus:border-emerald-500 focus:outline-none" />
          </div>
          <div *ngIf="form.get('date_mode')?.value === 'RANGE'">
            <span class="text-[11px] text-erp-text-muted block mb-0.5">Hasta</span>
            <input formControlName="date_end" type="date"
              class="w-full h-8 px-2 text-xs bg-erp-bg border border-erp-border rounded text-erp-text focus:bg-white focus:border-emerald-500 focus:outline-none" />
          </div>
        </div>
      </div>
    </div>

    <!-- 4. Clasificación Material & Ubicación -->
    <div class="flex flex-col gap-2 pt-1 border-t border-erp-border">
      <label class="text-[11px] uppercase font-bold tracking-wider text-erp-success flex items-center gap-1">
        <i class="fa-solid fa-boxes-stacked text-erp-success"></i> Clasificación Material
      </label>
      <div class="flex flex-col gap-1.5">
        <div>
          <span class="text-[11px] text-erp-text-muted block mb-0.5">Categorías</span>
          <p-multiSelect formControlName="id_categories" [options]="categoryOptions" optionLabel="name" optionValue="id"
            placeholder="Todas las categorías" appendTo="body"
            [filter]="true" filterBy="name" [showClear]="true" display="chip" styleClass="w-full text-xs"
            (onChange)="categoriesChanged()">
          </p-multiSelect>
        </div>
        <div>
          <span class="text-[11px] text-erp-text-muted block mb-0.5">Productos</span>
          <p-multiSelect formControlName="id_products" [options]="filteredProducts()" optionLabel="name" optionValue="id"
            placeholder="Todos los productos" appendTo="body"
            [filter]="true" filterBy="name,cod" [showClear]="true" display="chip" styleClass="w-full text-xs"
            (onChange)="apply()">
            <ng-template let-product pTemplate="item">
              <div class="flex items-center gap-2">
                <span class="text-erp-text-muted text-[11px] font-mono">{{ product.cod }}</span>
                <span class="text-erp-text-muted">|</span>
                <span class="font-semibold text-erp-text text-xs">{{ product.name }}</span>
              </div>
            </ng-template>
          </p-multiSelect>
        </div>


      </div>
    </div>

    <div class="flex flex-col gap-1.5 pt-2 border-t border-erp-border">
      <label for="provider-purchase-activity" class="text-[11px] font-semibold text-erp-text-muted">Compras del período</label>
      <p-dropdown inputId="provider-purchase-activity" formControlName="activity" [options]="activityOptions"
        optionLabel="label" optionValue="value" placeholder="Todos"
        (onChange)="apply()" styleClass="w-full text-xs" appendTo="body"></p-dropdown>
    </div>

    <!-- 5. Acción de Filtro -->
    <div class="flex flex-col gap-2 pt-2 border-t border-erp-border">
      <button type="submit" [disabled]="loading"
        class="erp-btn erp-btn-primary w-full">
        <i class="fa-solid fa-check-double text-sm"></i>
        <span>Aplicar Filtros</span>
      </button>
      <button type="button" (click)="clear()" [disabled]="loading"
        class="w-full h-8 bg-erp-bg hover:bg-slate-200 text-erp-text text-xs font-medium rounded-lg transition-colors flex items-center justify-center gap-1.5 cursor-pointer border border-erp-border">
        <i class="fa-solid fa-rotate-left text-xs"></i>
        <span>Restablecer Filtros</span>
      </button>
    </div>
  </form>
</aside>
