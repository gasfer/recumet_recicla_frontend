<form [formGroup]="form">
  <div class="card shadow mb-4 icon-box"><div class="card-body">
    <h3 class="text-center app-u-color-bg-2665c-99da769"><b>REPORTE DE COMPRAS</b></h3>
    <p-accordion [activeIndex]="0"><p-accordionTab header="Filtros">
      <div class="erp-form-grid cols-4 mb-3">
        <div class="erp-field">
          <label class="erp-label required">Sucursal</label>
          <p-multiSelect [options]="branches()" formControlName="id_sucursal" optionLabel="name" optionValue="id" display="chip" [filter]="true" [showClear]="true" [selectionLimit]="1" (onChange)="onBranchChange()" placeholder="Seleccione sucursal" class="erp-input"></p-multiSelect>
        </div>
        <div class="erp-field">
          <label class="erp-label">Área / Almacén</label>
          <p-multiSelect [options]="storages()" formControlName="id_storage" optionLabel="name" optionValue="id" display="chip" [filter]="true" [showClear]="true" placeholder="Seleccione almacenes" class="erp-input"></p-multiSelect>
        </div>
        <div class="erp-field">
          <label class="erp-label">Categorías</label>
          <p-multiSelect [options]="categories()" formControlName="category_ids" optionLabel="name" optionValue="id" display="chip" [filter]="true" [showClear]="true" (onChange)="onCategoryChange()" placeholder="Seleccione categorías" class="erp-input"></p-multiSelect>
        </div>
        <div class="erp-field">
          <label class="erp-label">Productos</label>
          <p-multiSelect [options]="products()" formControlName="id_products" optionLabel="name" optionValue="id" display="chip" [filter]="true" filterBy="name,cod" [showClear]="true" placeholder="Seleccione productos" class="erp-input"><ng-template let-product pTemplate="item">{{ product.cod }} · {{ product.name }}</ng-template></p-multiSelect>
        </div>
        <div class="erp-field">
          <label class="erp-label">Tipo filtrado</label>
          <p-dropdown [options]="filterTypes" formControlName="filterBy" optionLabel="name" optionValue="code" (onChange)="onFilterChange()" class="erp-input"></p-dropdown>
        </div>
        <div class="erp-field">
          <label class="erp-label">Fecha</label>
          <p-calendar *ngIf="form.value.filterBy === 'RANGE'" formControlName="dates" selectionMode="range" dateFormat="dd/mm/yy" [showIcon]="true" class="erp-input"></p-calendar>
          <p-calendar *ngIf="form.value.filterBy === 'MONTH'" formControlName="dates" view="month" dateFormat="mm/yy" [showIcon]="true" class="erp-input"></p-calendar>
          <p-calendar *ngIf="form.value.filterBy === 'YEAR'" formControlName="dates" view="year" dateFormat="yy" [showIcon]="true" class="erp-input"></p-calendar>
          <p-calendar *ngIf="form.value.filterBy === 'DAY'" formControlName="dates" dateFormat="dd/mm/yy" [showIcon]="true" class="erp-input"></p-calendar>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-3 flex-wrap">
        <p-button label="Buscar" icon="fa-solid fa-magnifying-glass" [loading]="loading()" (onClick)="search(true)"></p-button>
        <p-splitButton label="PDF" icon="fa-solid fa-file-pdf" [model]="pdfReports" styleClass="p-button-danger" [disabled]="loading()"></p-splitButton>
        <p-splitButton label="Excel" icon="fa-solid fa-file-excel" [model]="excelReports" styleClass="p-button-success" [disabled]="loading()"></p-splitButton>
        <p-button label="Limpiar" icon="fa-solid fa-broom" styleClass="p-button-secondary" [disabled]="loading()" (onClick)="clear()"></p-button>
      </div>
    </p-accordionTab></p-accordion>
  </div></div>
</form>
<p-tabMenu [model]="tabs" [styleClass]="loading() ? 'p-disabled mb-3' : 'mb-3'" [activeItem]="activeTab()"></p-tabMenu>
<app-table responsiveStrategy="scroll" [cols]="cols()" [searchFor]="searchFor()" [data]="inputs()" [loading]="loading()" [sortField]="'date_voucher'" [sortOrder]="'DESC'" (rows$)="paginate($event)" (customSort$)="customSort($event)" (search$)="tableSearch($event)"></app-table>
<app-modal-view-details-input></app-modal-view-details-input>
