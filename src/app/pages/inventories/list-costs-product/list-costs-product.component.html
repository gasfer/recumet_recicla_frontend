<form [formGroup]="formReport">
    <div class="card shadow mb-4 icon-box ">
      <div class="card-body">
        <div class="flex flex-wrap erp-layout-row gap-y-3 text-center">
          <h3 class="app-u-color-bg-2665c-99da769"><b>CONSULTA DE LISTA DE PRECIOS</b></h3>
        </div>
        <div class="p-fluid erp-form-grid mt-sm-3 mt-md-0 min-[768px]:pl-6 min-[768px]:pr-6">
          <div class="erp-field w-[100%] px-2 min-w-0">
            <div class="flex flex-wrap erp-layout-row gap-y-3 mt-1">
              <div class="w-[100%] px-2 min-w-0 min-[768px]:w-[50%] w-full">
                <div class="flex flex-wrap erp-layout-row gap-y-3">
                  <div class="w-[100%] px-2 min-w-0 min-[768px]:w-[50%] w-full">
                    <label class="block mb-1">Categoría</label>
                    <p-dropdown [options]="categories()"
                                [showClear]="true"
                                placeholder="Selecciona una opción"
                                optionLabel="name"
                                optionValue="code"
                                appendTo="body"
                                formControlName="id_category"
                    ></p-dropdown>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mb-2 mt-sm-3 mt-md-0 min-[768px]:pl-12 min-[768px]:pr-12 mr-4 bg-transparent text-right">
        <p-button (click)="!loading() ?  this.getAllAndSearchProducts(this.page(), this.rows()) : null" styleClass="p-button-rounded p-button-sm" label="Buscar"
          icon="fa-solid fa-magnifying-glass" [loading]="loading()"></p-button>
        <p-splitButton *ngIf="validatorsService.withPermission('COMPRAS','reports')" icon="fas fa-print" label="Imprimir" [model]="this.buttonItems"
          [menuStyle]="{'width':'10em'}"
          [size]="'small'"
          [rounded]="true"
          [severity]="'danger'"
          (onClick)="!loading() ? this.printPdfReport() : null" styleClass="ml-1">
          <app-loading></app-loading>
        </p-splitButton>
        <p-button (click)="clearInputs()" styleClass="p-button-rounded ml-1 mt-2 mt-sm-0 mt-md-0 p-button-success p-button-sm"
          icon="fas fa-broom" label="Limpiar" [pTooltip]="'Limpiar Campos'" [loading]="loading()">
        </p-button>
      </div>
      <p-tabMenu [model]="searchItems()" [styleClass]="loading() ? 'p-disabled' : ''"
        [activeItem]="searchItems()[0]"></p-tabMenu>
    </div>
  </form>
  <app-table-list-costs-products [cols]="cols()" (customSort$)="customSort($event)"
    [searchFor]="searchFor()" (rows$)="paginate($event)" (search$)="search($event)"
    [data]="productsCosts()" [loading]="loading()" (saveProduct$)="saveProductCostUpdate($event)">
  </app-table-list-costs-products>
