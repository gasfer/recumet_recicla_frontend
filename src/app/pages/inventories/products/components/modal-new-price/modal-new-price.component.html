<p-dialog [header]="'Registro precio para: ' + product?.name" [(visible)]="productsService.showModalNewPrice"
    [modal]="true" [draggable]="false"
    [resizable]="false" (onHide)="resetModal()"
    [dismissableMask]="true" styleClass="app-dialog--sm">
    <form [formGroup]="priceForm">
        <app-alert-notify></app-alert-notify>

        <!-- Fila 1: Nombre + Costo actual -->
        <div class="erp-form-grid mb-3">
            <div class="erp-field">
                <label class="erp-label required">Nombre</label>
                <input type="text" pInputText [pKeyFilter]="validatorsService.expRegValidInput"
                    formControlName="name" placeholder="EJ. PROMOCIÓN..."
                    class="erp-input text-uppercase"
                    [class.ng-dirty]="validatorsService.inputValid('name',priceForm)"/>
                <small *ngIf="validatorsService.inputValid('name',priceForm)" class="erp-error-msg">
                    {{ validatorsService.inputValidMessage("name",priceForm) }}
                </small>
            </div>
            <div class="erp-field">
                <label class="erp-label">Costo actual</label>
                <div class="flex items-center" style="min-height: 38px;">
                    <p-tag [rounded]="true"
                        [icon]="'fa-solid fa-hand-holding-dollar'"
                        severity="success"
                        [value]="product?.costo?.toString()">
                    </p-tag>
                </div>
            </div>
        </div>

        <!-- Fila 2: M. Utilidad + Precio de venta -->
        <div class="erp-form-grid mb-3">
            <div class="erp-field">
                <label class="erp-label required">M. Utilidad [%]</label>
                <p-inputNumber
                    locale="en-US"
                    mode="decimal"
                    inputId="locale-us"
                    formControlName="profit_margin"
                    [minFractionDigits]="decimalLength()"
                    [maxFractionDigits]="decimalLength()"
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    spinnerMode="horizontal"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    incrementButtonIcon="fa-solid fa-plus"
                    decrementButtonIcon="fa-solid fa-minus"
                    [class.ng-dirty]="validatorsService.inputValid('profit_margin',priceForm)"
                    [min]="0"
                    [max]="9999999999999.99">
                </p-inputNumber>
                <small *ngIf="validatorsService.inputValid('profit_margin',priceForm)" class="erp-error-msg">
                    {{ validatorsService.inputValidMessage("profit_margin",priceForm) }}
                </small>
            </div>
            <div class="erp-field">
                <label class="erp-label required">Precio de venta</label>
                <p-inputNumber
                    locale="en-US"
                    mode="decimal"
                    inputId="locale-us"
                    formControlName="price"
                    [minFractionDigits]="decimalLength()"
                    [maxFractionDigits]="decimalLength()"
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    spinnerMode="vertical"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    incrementButtonIcon="fa-solid fa-plus"
                    decrementButtonIcon="fa-solid fa-minus"
                    [class.ng-dirty]="validatorsService.inputValid('price',priceForm)"
                    [min]="0"
                    [max]="9999999999999.99">
                </p-inputNumber>
                <small *ngIf="validatorsService.inputValid('price',priceForm)" class="erp-error-msg">
                    {{ validatorsService.inputValidMessage("price",priceForm) }}
                </small>
            </div>
        </div>

        <!-- Fila 3: Estado (Switch alineado) -->
        <div class="erp-form-grid mb-2">
            <div class="erp-field erp-col-full">
                <label class="erp-label required">Estado</label>
                <div class="erp-toggle-field">
                    <p-inputSwitch formControlName="status"></p-inputSwitch>
                    <p-tag  [rounded]="true"
                            [icon]="priceForm.get('status')!.value ? 'fa-solid fa-circle-check' : 'fa-solid fa-trash-can'"
                            [styleClass]="priceForm.get('status')!.value ? 'app-status-active' : 'app-status-inactive'"
                            [value]="priceForm.get('status')!.value ? 'Activo' : 'Inactivo'">
                    </p-tag>
                </div>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button (click)="!loading() ? newPrice() : null" styleClass="p-button-sm p-button-rounded"
            label="Guardar" icon="fa-solid fa-floppy-disk" [loading]="loading()"></p-button>
        <p-button (click)="productsService.showModalNewPrice = false" label="Cancelar" styleClass="p-button-outlined p-button-sm p-button-rounded"></p-button>
    </ng-template>
</p-dialog>
