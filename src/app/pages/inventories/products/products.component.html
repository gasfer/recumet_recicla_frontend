<div class="card shadow">
  <p-toolbar>
    <div class="p-toolbar-group-left">
      <h4>LISTADO DE PRODUCTOS</h4>
    </div>
    <div *ngIf="validatorsService.withPermission('PRODUCTOS','create')" class="p-toolbar-group-right ms-1">
      <p-button icon="fa-solid fa-circle-plus" (click)="showModal()" pTooltip="Añadir Nuevo" tooltipPosition="left"
        styleClass="p-button-primary p-button-rounded" label="Añadir"></p-button>
      <p-button icon="fa-solid fa-sack-dollar" (click)="showListPrices()" pTooltip="Lista de precios"
        tooltipPosition="left" styleClass="p-button-success p-button-rounded ms-1" label="Lista de precios"></p-button>

      <!-- ✅ Exportar -->
      <p-button ariaLabel="Exportar productos a Excel" icon="fa-regular fa-file-excel" (click)="printExcelReport()" pTooltip="Exportar Excel"
        tooltipPosition="left" styleClass="p-button-rounded ms-1" ></p-button>
      <p-button ariaLabel="Exportar productos a PDF" icon="fa-regular fa-file-pdf" (click)="printPdfReport()" pTooltip="Exportar PDF" tooltipPosition="left"
        styleClass="p-button-danger p-button-rounded ms-1" ></p-button>
    </div>



  </p-toolbar>

  <app-modal-product></app-modal-product>

  <!-- FILA DE FILTROS -->
  <div class="grid p-3 pb-0 align-items-end">
    <!-- FILA DE FILTROS -->
    <div class="grid p-3 pb-0 align-items-end">
      <div class="row">
        <!-- Categoría multiselect — 1 col -->
        <div class="col-4 col-md-3">
          <label class="block mb-1 text-xs font-semibold text-color-secondary">CATEGORÍA</label>
          <p-multiSelect [options]="categoryOptions()" [(ngModel)]="selectedCategories"
            (onChange)="onCategoryChange($event.value)" optionLabel="name" optionValue="code"
            placeholder="Todas las categorías..." appendTo="body" [filter]="true"
            filterBy="name" [showClear]="true" display="chip" class="app-u-width-100-0466783"></p-multiSelect>
        </div>
        <!-- Búsqueda general — 3 cols -->
        <div class="col-8 col-md-9 ps-md-2">
          <label class="block mb-1 text-xs font-semibold text-color-secondary">BUSCAR</label>
          <div class="p-inputgroup">
            <p-dropdown [options]="searchFor()" [(ngModel)]="selectedSearchField" optionLabel="name" optionValue="code"
              appendTo="body" class="app-u-min-width-160px-94253f9"></p-dropdown>
            <input pInputText type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange($event)"
              placeholder="Escriba para buscar..." class="w-full" />
            <button aria-label="Limpiar búsqueda" *ngIf="searchQuery" pButton icon="fa-solid fa-xmark" class="p-button-secondary"
              (click)="clearSearch()"></button>
          </div>
        </div>
      </div>

    </div>


  </div>
  <!-- FIN FILTROS-->

    <p-tabMenu [model]="searchItems()" [styleClass]="loading() ? 'p-disabled' : ''" [activeItem]="searchItems()[0]"></p-tabMenu>


  <app-table responsiveStrategy="scroll" *ngIf="!status()" [cols]="cols()" (customSort$)="customSort($event)" [searchFor]="searchFor()"
    (rows$)="paginate($event)" (search$)="search($event)" [data]="products()" [loading]="loading()">
  </app-table>
  <app-table responsiveStrategy="scroll" *ngIf="status()" [cols]="cols()" (customSort$)="customSort($event)" [searchFor]="searchFor()"
    (rows$)="paginate($event)" (search$)="search($event)" [data]="products()" [loading]="loading()">
  </app-table>
</div>
<app-modal-prices></app-modal-prices>
<app-modal-assign-sucursales-products></app-modal-assign-sucursales-products>
<app-modal-providers-product></app-modal-providers-product>
