<p-dialog [header]="'Asignación de sucursales'" [(visible)]="userService.showModalSucursales"
    [modal]="true" [draggable]="false"
    [resizable]="false" (onShow)="this.getAllSucursales();"
    [dismissableMask]="true" styleClass="app-dialog--md">
    <form >
        <app-alert-notify [subTitle]="'Marca las sucursales a asignar'" [required]="false" [subTitle2]="''"></app-alert-notify>
        <p-table   [value]="sucursales()" styleClass="p-datatable-sm app-table-scroll" responsiveLayout="scroll">
            <ng-template pTemplate="header">
                <tr>
                    <th  class="text-white app-u-min-width-20px-e8f7a21 app-u-max-width-20px-76f960b background-primary" >SELEC.</th>
                    <th  class="text-white app-u-min-width-70px-27295af app-u-max-width-70px-460bb70 background-primary">NOMBRE</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-sucursal>
                <tr>
                    <td class="app-u-min-width-20px-e8f7a21 app-u-max-width-20px-76f960b">
                        <button
                            pButton
                            pTooltip="Asignar"
                            [attr.aria-label]="(sucursal.select ? 'Desasignar ' : 'Asignar ') + sucursal.name"
                            tooltipPosition="bottom"
                            (click)="assignSucursal(sucursal)"
                            pRipple
                            [icon]="sucursal.select ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle-check'"
                            class="p-button-rounded"
                            [ngClass]="{
                                'p-button-outlined' : !sucursal.select ,
                            }"
                        ></button>
                    </td>
                    <td class="text-start app-u-white-space-normal-f8f979b app-u-min-width-70px-27295af app-u-max-width-70px-460bb70">{{ sucursal.name }}</td>
                </tr>
            </ng-template>
        </p-table>
    </form>
    <ng-template pTemplate="footer">
        <p-button (click)="!loading() ? saveAssignSucursales() : null" styleClass="p-button-sm p-button-rounded"
            label="Guardar" icon="fa-solid fa-floppy-disk" [loading]="loading()"></p-button>
        <p-button (click)="userService.showModalSucursales = false" label="Cancelar" styleClass="p-button-outlined p-button-sm p-button-rounded"></p-button>
    </ng-template>
</p-dialog>
