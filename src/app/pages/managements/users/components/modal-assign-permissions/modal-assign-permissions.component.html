<p-dialog [header]="'Asignación de permisos a:'"
  [(visible)]="userService.showModalAssignPermissions"
  [modal]="true"
  [breakpoints]="{ '960px': '75vw', '576px': '95%' }"
  [style]="{ width: '70vw' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onHideModal()"
  [dismissableMask]="true">

  <form *ngIf="permissionsForm" [formGroup]="permissionsForm">

    <!-- Información del usuario -->
    <div class="mb-3 p-3"
      style="background-color: #f8f9fa; border-left: 4px solid var(--bg-primary); border-radius: 4px;">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-user text-primary fs-12"></i>
        <div>
          <span class="fw-bold fs-12">{{ user()?.full_names }}</span>
          <span class="text-muted ms-2" *ngIf="user()?.email">
            ({{ user()?.email }})
          </span>
        </div>
      </div>
    </div>

    <app-alert-notify
      [subTitle]="'Selecciona los accesos por módulo.'"
      [subTitle2]="'Se restringirá el acceso'"
      [required]="false">
    </app-alert-notify>

    <div class="permissions-container" style="max-height: 550px; overflow-y: auto;">

      <div *ngFor="let group of permissionGroups(); let groupIdx = index" class="mb-3">

        <!-- Encabezado -->
        <div class="group-header p-3 cursor-pointer"
             style="background-color: var(--bg-primary); border-radius: 8px;"
             (click)="toggleGroup(groupIdx)">
          <div class="d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid {{ group.icon }} text-white fs-5"></i>
              <span class="text-white fw-bold">{{ group.name }}</span>
              <span class="badge bg-light text-dark ms-2">
                {{ group.permissions.length }}
              </span>
            </div>
            <i class="fa-solid text-white"
               [ngClass]="group.expanded ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
          </div>
        </div>

        <!-- Tabla -->
        <div *ngIf="group.expanded && formArray.length > 0"
             class="mt-2"
             style="animation: fadeIn 0.3s;">

          <!-- CONTEXTO CORRECTO DEL FORM ARRAY -->
          <div formArrayName="permissions">

            <p-table [value]="group.permissions"
                     [scrollable]="true"
                     scrollHeight="300px"
                     [styleClass]="'p-datatable-sm p-datatable-striped'">

              <!-- HEADER -->
              <ng-template pTemplate="header">
                <tr>
                  <th style="background-color: #f8f9fa; min-width: 200px;">Módulo</th>
                  <th class="text-center">Ver</th>
                  <th class="text-center">Crear</th>
                  <th class="text-center">Modificar</th>
                  <th class="text-center">Eliminar</th>
                  <th class="text-center">Reporte</th>
                </tr>
              </ng-template>

              <!-- BODY -->
              <ng-template pTemplate="body" let-permission let-i="rowIndex">
                <tr [formGroupName]="getPermissionIndex(groupIdx, i)">

                  <td>
                    <span class="fw-medium">{{ permission.module }}</span>
                  </td>

                  <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                      <p-checkbox formControlName="view" [binary]="true"></p-checkbox>
                      <i class="fa-solid"
                         style="color: #008000;"
                         [ngClass]="permission.view ? 'fa-eye' : 'fa-xmark'"></i>
                    </div>
                  </td>

                  <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                      <p-checkbox formControlName="create" [binary]="true"></p-checkbox>
                      <i class="fa-solid"
                         style="color: #0D89EC;"
                         [ngClass]="permission.create ? 'fa-circle-plus' : 'fa-xmark'"></i>
                    </div>
                  </td>

                  <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                      <p-checkbox formControlName="update" [binary]="true"></p-checkbox>
                      <i class="fa-solid"
                         style="color: #FAB710;"
                         [ngClass]="permission.update ? 'fa-edit' : 'fa-xmark'"></i>
                    </div>
                  </td>

                  <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                      <p-checkbox formControlName="delete" [binary]="true"></p-checkbox>
                      <i class="fa-solid"
                         style="color: #C02929;"
                         [ngClass]="permission.delete ? 'fa-trash-can' : 'fa-xmark'"></i>
                    </div>
                  </td>

                  <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                      <p-checkbox formControlName="reports" [binary]="true"></p-checkbox>
                      <i class="fa-solid"
                         style="color: #56717D;"
                         [ngClass]="permission.reports ? 'fa-file-pdf' : 'fa-xmark'"></i>
                    </div>
                  </td>

                </tr>
              </ng-template>

            </p-table>
          </div>
        </div>

      </div>
    </div>

  </form>

  <!-- FOOTER -->
  <ng-template pTemplate="footer">
    <p-button
      (click)="!loading() ? sendNewPermissions() : null"
      styleClass="p-button-sm p-button-rounded"
      label="Guardar"
      icon="fa-solid fa-floppy-disk"
      [loading]="loading()">
    </p-button>

    <p-button
      (click)="userService.showModalAssignPermissions = false"
      label="Cancelar"
      styleClass="p-button-outlined p-button-sm p-button-rounded">
    </p-button>
  </ng-template>

</p-dialog>
