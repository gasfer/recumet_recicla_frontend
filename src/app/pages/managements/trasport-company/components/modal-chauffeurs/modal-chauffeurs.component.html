<p-dialog [header]="'Conductores de transporte'" [(visible)]="transportCompanyService.showModalChauffeurs" [modal]="true" [draggable]="false"
    [resizable]="false" [dismissableMask]="true" [breakpoints]="{'800px': '94vw'}"
    [style]="{width: 'min(56rem, calc(100vw - 2rem))'}" [contentStyle]="{maxHeight: 'calc(100dvh - 9rem)', overflow: 'auto'}"
    styleClass="app-dialog--xl erp-operational-dialog transport-child-list-dialog" transitionOptions="250ms cubic-bezier(0.2, 0, 0, 1)" closeIcon="fa-solid fa-xmark" closeAriaLabel="Cerrar modal">
    <div class="transport-child-list-toolbar">
        <h3>{{transportCompany?.name}}</h3>
        <p-button *ngIf="validatorsService.withPermission('COMP. TRASPORTE','create')" icon="fa-solid fa-circle-plus" (click)="transportCompanyService.isEditChauffeur = false; transportCompanyService.showModalNewChauffeur = true" pTooltip="Añadir Nuevo" tooltipPosition="left"
            styleClass="p-button-primary p-button-rounded mb-1" label="Añadir"></p-button>
    </div>
    <app-table responsiveStrategy="stack" [cols]="cols()" [includeSearch]="false" [data]="chauffeurs()"
         [loading]="false" [isCustomSort]="false"
        [customPagination]="true">
    </app-table>
    <ng-template pTemplate="footer">
        <p-button type="button" (click)="transportCompanyService.showModalChauffeurs = false" label="Cerrar"
            styleClass="p-button-outlined p-button-sm p-button-rounded"></p-button>
    </ng-template>
</p-dialog>
<app-modal-new-chauffeur></app-modal-new-chauffeur>
