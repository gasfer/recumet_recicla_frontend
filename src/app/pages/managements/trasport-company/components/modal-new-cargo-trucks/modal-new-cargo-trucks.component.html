<p-dialog [header]="transportCompanyService.isEditCargoTruck ? 'Editar camión' : 'Registro de camión para: ' + transportCompany?.name" [(visible)]="transportCompanyService.showModalNewCargoTruck"
    [modal]="true" [draggable]="false"
    [resizable]="false" (onHide)="resetModal()"
    [dismissableMask]="true" styleClass="app-dialog--sm" transitionOptions="250ms cubic-bezier(0.2, 0, 0, 1)" closeIcon="fa-solid fa-xmark" closeAriaLabel="Cerrar modal">
    <form [formGroup]="cargoTruckForm" class="erp-form-grid">
        <app-alert-notify></app-alert-notify>
        <div class="erp-field" *ngIf="transportCompanyService.isEditCargoTruck">
            <label class="erp-label required" for="cargo-truck-transport-company">Empresa de transporte</label>
            <p-dropdown inputId="cargo-truck-transport-company" class="erp-input" [options]="transportCompanies()"
                optionLabel="name" optionValue="id" placeholder="Selecciona empresa" appendTo="body"
                formControlName="id_trasport_company"></p-dropdown>
        </div>
        <div class="p-fluid grid">
            <div class="field col-12">
                <div class="field">
                    <label class="erp-label required" for="cargo-truck-plate">Placa
                    </label>
                    <input id="cargo-truck-plate" type="text" pInputText class="erp-input" [pKeyFilter]="validatorsService.expRegValidInput"
                        formControlName="placa" placeholder="EJ. 123ABC..."
                        [class.ng-dirty]="validatorsService.inputValid('placa',cargoTruckForm)" class="text-uppercase"/>
                    <small *ngIf="validatorsService.inputValid('placa',cargoTruckForm)" class="p-error block">
                        {{ validatorsService.inputValidMessage("placa",cargoTruckForm) }}
                    </small>
                </div>
                <div class="row mt-1 ">
                    <label class="block">Estado:<span class="text-danger">*</span></label>
                </div>
                <div class="row mt-0">
                    <div class="col-3">
                        <p-inputSwitch formControlName="status"></p-inputSwitch>
                    </div>
                    <div class="col">
                        <p-tag  [rounded]="true"
                                [icon]="cargoTruckForm.get('status')!.value ? 'fa-solid fa-circle-check' : 'fa-solid fa-trash-can'"
                                [styleClass]="cargoTruckForm.get('status')!.value ? 'app-status-active' : 'app-status-inactive'"
                                [value]="cargoTruckForm.get('status')!.value ? 'Activo' : 'Inactivo'">
                        </p-tag>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button type="button" (click)="!loading() ? saveCargoTruck() : null" styleClass="p-button-sm p-button-rounded"
            [label]="transportCompanyService.isEditCargoTruck ? 'Guardar cambios' : 'Guardar'" icon="fa-solid fa-floppy-disk" [loading]="loading()"></p-button>
        <p-button (click)="transportCompanyService.showModalNewCargoTruck = false" label="Cancelar" styleClass="p-button-outlined p-button-sm p-button-rounded"></p-button>
    </ng-template>
</p-dialog>
