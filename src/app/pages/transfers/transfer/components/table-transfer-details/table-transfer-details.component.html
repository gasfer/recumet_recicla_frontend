<div class="row animated fadeIn fast m-1"
    *ngIf="transfersService.detailTransfer().length === 0">
    <div class="col-12">
        <div class="alert alert-info text-center">
            <h5 class="alert-heading">Sin productos</h5>
            <i class="fa fa-spin fa-refresh fa-2x"></i>
            <p class="mb-0">Agrega productos desde el buscador</p>
        </div>
    </div>
</div>
<p-table *ngIf="transfersService.detailTransfer().length !== 0" [value]="transfersService.detailTransfer()" styleClass="p-datatable-sm app-table-scroll" responsiveLayout="scroll">
    <ng-template pTemplate="header">
        <tr>
            <th class="text-white app-u-min-width-120px-651945a app-u-max-width-300px-aef3df2 background-primary">Producto</th>
            <th class="text-white text-center background-primary">Cantidad</th>
            <th class="text-white text-center app-u-min-width-60px-71f5ad8 app-u-max-width-60px-d4de838 background-primary">Quitar</th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
        <tr>
            <td class="app-u-min-width-120px-651945a app-u-max-width-300px-aef3df2">
                <h5 class="m-0 p-0">{{product.name}}</h5>
                <p class="text-muted app-u-font-size-10px-0d5be05">{{product.description}} <br *ngIf="product.description"> <span class="text-black">{{product.cod}} / {{product.category.name}} / {{product.unit.name}}</span></p>
            </td>
            <td  class="text-center">
                <p-inputNumber

                    [size]="5"
                    locale="en-US"
                    mode="decimal"
                    [minFractionDigits]="2"
                    [showButtons]="true"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    placeholder="0"
                    [min]="0.1"
                    [max]="product.total_stock"
                    [inputId]="product.id"
                    [(ngModel)] = "product.quantity"
                    (onInput)="updateQuantityProduct($event, product)" class="app-u-height-38px-3b84911">
                </p-inputNumber>
            </td>
            <td class="text-center app-u-min-width-60px-71f5ad8 app-u-max-width-60px-d4de838">
                <p-button ariaLabel="Eliminar"
                    (click)="deleteProductForDetailSale(product.id)"
                    icon="fa-regular fa-trash-can"
                    styleClass=" p-button-sm p-button-danger p-button-rounded">
                </p-button>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="footer">
        <tr>
            <th colspan="1" class="text-end text-white pt-1 background-primary"><h4>Total: &nbsp;</h4></th>
            <th colspan="1" class="text-center text-white pt-1 background-primary"><h4>{{ totalSummary()  | number:decimal() }}</h4></th>
            <th colspan="1" class="background-primary"></th>
        </tr>
        <tr>
            <td colspan="2" class="text-end bg-white">
                <p-button
                    (click)="clearDetailSale()"
                    icon="fa-solid fa-ban"  pTooltip="Cancelar Transferencia"
                    label="Cancelar"
                    tooltipPosition="left"
                    styleClass="p-button p-button-sm p-button-danger p-button-rounded">
                </p-button>
            </td>
            <td colspan="2" class="text-center bg-white">
                <p-button
                    styleClass="p-button-sm p-button-rounded"
                    label="Registrar Transferencia"
                    (click)="transfersService.showModalSaveTransfer = true"
                    icon="fa-solid fa-floppy-disk">
                </p-button>
            </td>
        </tr>
    </ng-template>
</p-table>
