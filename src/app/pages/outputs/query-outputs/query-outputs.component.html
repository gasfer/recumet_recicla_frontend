<form [formGroup]="formReport">
    <div class="card shadow mb-4 icon-box ">
        <div class="card-body">
            <div class="flex flex-wrap erp-layout-row gap-y-3 text-center">
                <h3 class="app-u-color-bg-2665c-99da769"><b>CONSULTA DE VENTAS</b></h3>
            </div>
            <p-accordion [activeIndex]="1">
                <p-accordionTab header="Filtros">
                    <div class="erp-form-grid cols-4 erp-filter-grid sales-query-filter-grid">
                        <div class="erp-field">
                            <label class="erp-label required" for="sales-filter-period">Tipo de filtro</label>
                            <p-dropdown inputId="sales-filter-period" class="erp-input" [options]="types_filtrado()" formControlName="filterBy"
                                optionLabel="name" optionValue="code" appendTo="body" (onChange)="onChangeTypesFilter()">
                            </p-dropdown>
                        </div>
                        <div class="erp-field">
                            <label class="erp-label required" for="monthpicker">Fecha</label>
                            <p-calendar *ngIf="formReport.get('filterBy')?.value == 'MONTH'" class="erp-input" formControlName="dates"
                                view="month" dateFormat="mm/yy" [readonlyInput]="true" inputId="monthpicker" placeholder="MM/YYYY"
                                [class.ng-dirty]="validatorsService.inputValid('dates',formReport)" [showIcon]="true">
                            </p-calendar>
                            <p-calendar *ngIf="formReport.get('filterBy')?.value == 'RANGE'" class="erp-input" formControlName="dates"
                                selectionMode="range" dateFormat="dd/mm/yy" [readonlyInput]="true" inputId="range" placeholder="DD/MM/YYYY"
                                [class.ng-dirty]="validatorsService.inputValid('dates',formReport)" [showIcon]="true">
                            </p-calendar>
                            <p-calendar *ngIf="formReport.get('filterBy')?.value == 'YEAR'" class="erp-input" formControlName="dates"
                                view="year" dateFormat="yy" inputId="yearpicker" [showIcon]="true" placeholder="YYYY"
                                [class.ng-dirty]="validatorsService.inputValid('dates',formReport)">
                            </p-calendar>
                            <p-calendar *ngIf="formReport.get('filterBy')?.value == 'DAY'" class="erp-input" formControlName="dates"
                                inputId="basic" dateFormat="dd/mm/yy" [showIcon]="true" placeholder="DD/MM/YYYY"
                                [class.ng-dirty]="validatorsService.inputValid('dates',formReport)">
                            </p-calendar>
                            <small *ngIf="validatorsService.inputValid('dates',formReport)" class="p-error block">
                                {{ validatorsService.inputValidMessage("dates",formReport) }}
                            </small>
                        </div>
                        <div class="erp-field">
                            <label class="erp-label" for="sales-filter-registry">Tipo de registro</label>
                            <p-dropdown inputId="sales-filter-registry" class="erp-input" [options]="types_registry()" [showClear]="true"
                                placeholder="Selecciona una opción" optionLabel="name" optionValue="code" appendTo="body"
                                formControlName="type_registry" [class.ng-dirty]="validatorsService.inputValid('type_registry',formReport)">
                            </p-dropdown>
                        </div>
                        <div class="erp-field">
                            <label class="erp-label" for="sales-filter-type">Tipo de venta</label>
                            <p-dropdown inputId="sales-filter-type" class="erp-input" [options]="types_output()" [showClear]="true"
                                placeholder="Selecciona una opción" optionLabel="name" optionValue="name" appendTo="body"
                                formControlName="type_output" [class.ng-dirty]="validatorsService.inputValid('type_output',formReport)">
                            </p-dropdown>
                        </div>
                        <div class="erp-field">
                            <label class="erp-label" for="sales-filter-storage">Área / almacén</label>
                            <p-dropdown inputId="sales-filter-storage" class="erp-input" [options]="validatorsService.storages()"
                                placeholder="Selecciona un almacén" optionLabel="name" optionValue="id" [showClear]="true" appendTo="body"
                                [filter]="true" filterBy="name" [virtualScrollItemSize]="38" [lazy]="true" formControlName="id_storage"
                                [class.ng-dirty]="validatorsService.inputValid('id_storage',formReport)">
                            </p-dropdown>
                            <small *ngIf="validatorsService.inputValid('id_storage',formReport)" class="p-error block">
                                {{ validatorsService.inputValidMessage("id_storage",formReport) }}
                            </small>
                        </div>
                        <div class="erp-field erp-filter-search-field">
                            <label class="erp-label" for="sales-client-search">Cliente</label>
                            <app-input-search inputId="sales-client-search" (onEnters)="suggestedsClient($event)" (onDebounce)="suggestedsClient($event)"
                                [icon]="'fa-solid fa-magnifying-glass-arrow-right'" [placeholder]="'Busque un cliente aquí....'">
                            </app-input-search>
                            <div class="erp-filter-search-results">
                                <ul *ngIf="loadingSearchClient()" class="erp-filter-search-list" role="status">
                                    <li><i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i> Cargando clientes…</li>
                                </ul>
                                <ul *ngIf="suggestedClient().length" class="erp-filter-search-list" role="listbox">
                                    <li *ngFor="let client of suggestedClient()" role="option" tabindex="0"
                                        (click)="selectClient(client)" (keydown.enter)="selectClient(client)">
                                        {{ client.full_names }} <span>— {{ client.number_document }}</span>
                                    </li>
                                </ul>
                                <ul *ngIf="suggestedClient().length == 0 && txtSearchClient() && !loadingSearchClient()" class="erp-filter-search-list" role="status">
                                    <li>No se encontró el cliente: “{{ txtSearchClient() | uppercase }}”</li>
                                </ul>
                            </div>
                        </div>
                        <div class="erp-field erp-filter-selected-value">
                            <label class="erp-label">Cliente seleccionado</label>
                            <div class="erp-filter-selected-value-content">
                                <p-tag [rounded]="true" icon="fa-solid fa-tag" [severity]="clientSelect() ? 'info' : 'warning'"
                                    [value]="clientSelect() ? clientSelect()?.full_names + ' - ' + (clientSelect()?.number_document ?? '') : 'SELECCIONE UN CLIENTE'">
                                    <p-badge *ngIf="clientSelect()" class="cursor-pointer" severity="danger" (click)="clearSelectClient()"
                                        [value]="'X'" pTooltip="Quitar Cliente" tooltipPosition="top"></p-badge>
                                </p-tag>
                            </div>
                        </div>
                    </div>
                    <div class="erp-filter-actions">
                        <p-button (click)="!loading() ? this.getAllAndSearchOutputs(1,rows()) : null"
                            styleClass="p-button-sm" label="Buscar" icon="fa-solid fa-magnifying-glass"
                            [loading]="loading()"></p-button>
                        <p-splitButton *ngIf="this.validatorsService.withPermission('VENTAS','reports')" icon="fas fa-print" label="Imprimir" [model]="this.buttonItems"
                            [menuStyle]="{'width':'10em'}" (onClick)="!loading() ? printPdfReport() : null"
                            [size]="'small'"
                            [severity]="'danger'"
                            styleClass="erp-filter-print-action">
                        </p-splitButton>
                        <p-button (click)="clearInputs()"
                            styleClass="p-button-success p-button-sm" icon="fas fa-broom"
                            label="Limpiar" [pTooltip]="'Limpiar Campos'" [loading]="loading()">
                        </p-button>
                    </div>
                </p-accordionTab>
            </p-accordion>
        </div>
        <p-tabMenu [model]="searchItems()" [styleClass]="loading() ? 'p-disabled' : ''"
            [activeItem]="searchItems()[0]"></p-tabMenu>
    </div>
</form>
<app-table responsiveStrategy="scroll" [cols]="cols()" [searchFor]="searchFor()" (rows$)="paginate($event)" (search$)="search($event)"
    [data]="outputs()" [loading]="loading()" (customSort$)="customSort($event)">
</app-table>

<app-modal-view-details-output></app-modal-view-details-output>
