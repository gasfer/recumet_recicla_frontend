<form [formGroup]="formReport">
  <section class="erp-section rounded-xl border mb-4 overflow-hidden">
    <div class="p-4">
      <h3 class="text-erp-text text-lg font-bold mb-3">Consulta de clasificados</h3>
      <div class="erp-card-header rounded-t-lg px-4 py-3 flex items-center gap-2"><i class="fa-solid fa-filter" aria-hidden="true"></i><span>Filtros de clasificados</span></div>
      <p *ngIf="catalogError()" role="alert" class="text-erp-danger px-4 pt-3">{{ catalogError() }}</p>
      <div class="erp-form-grid erp-filter-grid">
        <div class="erp-field"><label class="erp-label required" for="classified-period">Período</label>
          <p-dropdown inputId="classified-period" class="erp-input" [options]="types_filtrado()" formControlName="filterBy" optionLabel="name" optionValue="code" appendTo="body" (onChange)="onChangeTypesFilter()"></p-dropdown>
        </div>
        <div class="erp-field"><label class="erp-label required" [attr.for]="'classified-date-' + formReport.get('filterBy')?.value">Fecha</label>
          <p-calendar *ngIf="formReport.get('filterBy')?.value === 'MONTH'" class="erp-input" formControlName="dates" view="month"  dateFormat="mm/yy" [showIcon]="true" [readonlyInput]="true" inputId="classified-date-MONTH"></p-calendar>
<p-calendar *ngIf="formReport.get('filterBy')?.value === 'YEAR'" class="erp-input" formControlName="dates" view="year"  dateFormat="yy" [showIcon]="true" [readonlyInput]="true" inputId="classified-date-YEAR"></p-calendar>
<p-calendar *ngIf="formReport.get('filterBy')?.value === 'DAY'" class="erp-input" formControlName="dates"   dateFormat="dd/mm/yy" [showIcon]="true" [readonlyInput]="true" inputId="classified-date-DAY"></p-calendar>
<p-calendar *ngIf="formReport.get('filterBy')?.value === 'RANGE'" class="erp-input" formControlName="dates"  selectionMode="range" dateFormat="dd/mm/yy" [showIcon]="true" [readonlyInput]="true" inputId="classified-date-RANGE"></p-calendar>
          <small *ngIf="validatorsService.inputValid('dates', formReport)" class="text-erp-danger">{{ validatorsService.inputValidMessage('dates', formReport) }}</small>
        </div>
        <div class="erp-field"><label class="erp-label" for="classified-storage">Área / Almacén</label>
          <p-dropdown inputId="classified-storage" class="erp-input" [options]="validatorsService.storages()" formControlName="id_storage" optionLabel="name" optionValue="id" [showClear]="true" [filter]="true" placeholder="Todos los almacenes" appendTo="body"></p-dropdown>
        </div>
        <div class="erp-field"><label class="erp-label" for="classified-registry">Tipo de registro</label>
          <p-dropdown inputId="classified-registry" class="erp-input" [options]="types_registry()" formControlName="type_registry" optionLabel="name" optionValue="code" [showClear]="true" placeholder="Todos los registros" appendTo="body"></p-dropdown>
        </div>
        <div class="erp-field"><label class="erp-label" for="classified-categories">Categorías</label>
          <p-multiSelect inputId="classified-categories" styleClass="erp-input w-full" [options]="categories()" formControlName="category_ids" optionLabel="name" optionValue="id" [filter]="true" [showClear]="true" display="chip" placeholder="Todas las categorías" appendTo="body" [maxSelectedLabels]="2" selectedItemsLabel="{0} categorías seleccionadas"></p-multiSelect>
        </div>
        <div class="erp-field"><label class="erp-label" for="classified-products">Productos de origen</label>
          <p-multiSelect inputId="classified-products" styleClass="erp-input w-full" [options]="products()" formControlName="product_ids" optionLabel="label" optionValue="id" [filter]="true" [showClear]="true" display="chip" placeholder="Todos los productos" appendTo="body" [virtualScroll]="true" [virtualScrollItemSize]="38" [maxSelectedLabels]="2" selectedItemsLabel="{0} productos seleccionados"></p-multiSelect>
        </div>
      </div>
      <div class="flex flex-wrap justify-end gap-2 pt-3 border-t border-erp-border">
        <button type="button" class="erp-btn erp-btn-primary flex-1 sm:flex-none" [disabled]="loading()" (click)="getAllAndSearchClassifieds(1, rows())"><i class="fa-solid" [ngClass]="loading() ? 'fa-spinner fa-spin' : 'fa-magnifying-glass'" aria-hidden="true"></i> Buscar</button>
        <button type="button" *ngIf="validatorsService.withPermission('CLASIFICADOS','reports')" class="erp-btn erp-btn-primary flex-1 sm:flex-none" [disabled]="loading()" (click)="classifiedReportMenu.toggle($event)" aria-haspopup="menu" aria-controls="classified-reports"><i class="fa-solid fa-file-export" aria-hidden="true"></i> Exportar reporte <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
        <p-menu #classifiedReportMenu id="classified-reports" [popup]="true" [model]="buttonItems" appendTo="body" styleClass="stock-export-menu purchase-report-menu"></p-menu>
        <button type="button" class="erp-btn erp-btn-secondary flex-1 sm:flex-none" [disabled]="loading()" (click)="clearInputs()"><i class="fa-solid fa-broom" aria-hidden="true"></i> Limpiar</button>
      </div>
    </div>
      <p-tabMenu [model]="searchItems()" [styleClass]="loading() ? 'p-disabled' : ''"
        [activeItem]="searchItems()[0]"></p-tabMenu>
  </section>
</form>
  <app-table responsiveStrategy="scroll"  [cols]="cols()" (customSort$)="customSort($event)"
    [searchFor]="searchFor()" (rows$)="paginate($event)" (search$)="search($event)"
    [data]="classifieds()" [loading]="loading()">
  </app-table>

  <app-modal-view-details-classified></app-modal-view-details-classified>
