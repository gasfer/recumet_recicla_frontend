<p-dialog [header]="'Tipo de Cambio Dólar a Bolivianos'" [(visible)]="componentsService.setShowModalBsSus" [modal]="true" [draggable]="false"
    [resizable]="false" (onShow)="focusOnInput()" [dismissableMask]="true"
    [breakpoints]="{'640px': '94vw'}" [style]="{width: 'min(34rem, calc(100vw - 2rem))'}"
    [contentStyle]="{maxHeight: 'calc(100dvh - 9rem)', overflow: 'auto'}"
    styleClass="app-dialog--sm erp-operational-dialog exchange-rate-dialog">
    <form [formGroup]="updateBsForm">
        <div class="erp-form-grid mb-3">
            <div class="erp-field">
                <label class="erp-label" for="exchange-rate-current">Cambio actual (Bs. / $)</label>
                <p-inputNumber
                    inputId="exchange-rate-current"
                    formControlName="actual_cambio"
                    [size]="5"
                    locale="en-US"
                    mode="decimal"
                    [minFractionDigits]="2"
                    [showButtons]="true"
                    decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary"
                    [min]="0"
                    (onInput)="newCambio()"
                    [max]="9999999999999.99"
                    class="erp-input w-full">
                </p-inputNumber>
            </div>
            <div class="erp-field">
                <label class="erp-label required" for="exchange-rate-new">Nuevo tipo de cambio ($)</label>
                <p-inputNumber #txtInputCambio locale="en-US" mode="decimal" inputId="exchange-rate-new"
                    formControlName="cambio"
                    [minFractionDigits]="decimalLength()"
                    [maxFractionDigits]="decimalLength()"
                    [showButtons]="true"
                    (onInput)="newCambio()"
                    buttonLayout="horizontal" spinnerMode="horizontal" decrementButtonClass="p-button-secondary"
                    incrementButtonClass="p-button-primary" incrementButtonIcon="fa-solid fa-plus"
                    decrementButtonIcon="fa-solid fa-minus" (keydown.enter)="updateBsSus()" [min]="0"
                    [max]="9999999999999.99"
                    class="erp-input w-full">
                </p-inputNumber>
            </div>
        </div>
        <div class="erp-toggle-pill exchange-rate-preview">
            <span class="exchange-rate-preview__label"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>Conversión vista previa</span>
            <span class="exchange-rate-preview__value">{{ previewCambio() | number: decimal() }} Bs.</span>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <p-button type="button" (click)="updateBsSus()" styleClass="p-button-sm p-button-rounded" label="Guardar"
            icon="fa-solid fa-floppy-disk"></p-button>
        <p-button type="button" (click)="componentsService.setShowModalBsSus = false" label="Cancelar"
            styleClass="p-button-outlined p-button-sm p-button-rounded"></p-button>
    </ng-template>
</p-dialog>
