<!-- ========== Left Sidebar Start ========== -->
<div class="vertical-menu" [class.is-condensed]="isCondensed">
  <!-- Cabecera Brand Compacta -->
  <div class="sidebar-brand-wrapper">
    <div class="brand-badge-box">
      <img src="assets/img/logo.png" alt="RECUMET" class="brand-badge-img">
    </div>
    <div class="brand-text-col">
      <div class="brand-title-row">
        <strong class="brand-name">RECUMET ERP</strong>
      </div>
    </div>
  </div>

  <!-- Buscador de Módulos Rápido -->
  <div class="sidebar-search-container" *ngIf="!isCondensed">
    <div class="search-box-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input
        #searchInput
        type="text"
        [value]="searchTerm"
        (input)="onSearchChange($event)"
        placeholder="Buscar módulo..."
        class="search-input-field"
        aria-label="Buscar módulo en el menú"
      />
      <kbd class="search-shortcut-kbd">Ctrl K</kbd>
    </div>
  </div>

  <!-- Contenedor con Scroll de Grupos de Menú -->
  <ngx-simplebar class="sidebar-scroll" #componentRef>
    <div class="sidebar-groups-wrapper">
      <div
        *ngFor="let group of filteredGroups; trackBy: trackByGroupId"
        class="group-accordion-card"
        [class.is-open]="group.isOpen"
      >
        <!-- Cabecera de Categoría / Acordeón -->
        <a *ngIf="group.directItem" [routerLink]="group.directItem.link"
          routerLinkActive="active" class="nav-link-item-1">
          <i [class]="getItemIcon(group.directItem)" class="nav-item-icon"></i>
          <span class="nav-item-label">{{ group.title | translate }}</span>
        </a>
        <button
          *ngIf="!group.directItem"
          type="button"
          class="group-header-button"
          (click)="toggleGroup(group)"
          [attr.aria-expanded]="group.isOpen"
        >
          <div class="group-header-left">
            <span class="group-indicator-dot"></span>
            <span class="group-title-text">{{ group.title | translate | uppercase }}</span>
          </div>
          <div class="group-header-right">
            <span class="group-count-badge">{{ group.badgeCount }}</span>
            <i class="fa-solid fa-chevron-right group-chevron-icon" [class.is-rotated]="group.isOpen"></i>
          </div>
        </button>

        <!-- Contenido Desplegable del Grupo -->
        <div class="group-items-collapse" *ngIf="group.isOpen && !group.directItem">
          <ul class="nav-items-list">
            <li *ngFor="let item of group.items; trackBy: trackByItem" class="nav-item-entry">
              <!-- Ítem Nivel 1 Directo (Ruta) -->
              <a
                *ngIf="!hasItems(item) && item.link"
                [routerLink]="item.link"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: false }"
                class="nav-link-item-1"
              >
                <i [class]="getItemIcon(item)" class="nav-item-icon"></i>
                <span class="nav-item-label">{{ item.label ?? '' | translate }}</span>
                <span class="badge rounded-pill bg-{{item.badge.variant}} ms-auto" *ngIf="item.badge">
                  {{ item.badge.text | translate }}
                </span>
              </a>

              <!-- Ítem Nivel 1 con Submenú (Menu 1 Padre) -->
              <div *ngIf="hasItems(item)" class="nav-sub-wrapper">
                <a
                  href="javascript:void(0);"
                  class="nav-link-item-1 has-submenu"
                  [class.active]="hasActiveSubChild(item)"
                  (click)="toggleSubItem(item, $event)"
                >
                  <i [class]="getItemIcon(item)" class="nav-item-icon"></i>
                  <span class="nav-item-label">{{ item.label ?? '' | translate }}</span>
                  <i
                    class="fa-solid fa-chevron-down sub-toggle-chevron"
                    [class.is-open]="isSubItemExpanded(item)"
                  ></i>
                </a>

                <!-- Submenú Nivel 2 (Menu 2 Hijos) -->
                <ul class="nav-sub-list-2" *ngIf="isSubItemExpanded(item)">
                  <li *ngFor="let subitem of item.subItems; trackBy: trackBySubItem">
                    <a
                      [routerLink]="subitem.link"
                      routerLinkActive="active"
                      [routerLinkActiveOptions]="{ exact: false }"
                      class="nav-link-item-2"
                    >
                      <span class="sub-bullet-symbol">›</span>
                      <span class="sub-label-text">{{ subitem.label ?? '' | translate }}</span>
                      <span class="badge rounded-pill bg-{{subitem.badge.variant}} ms-auto" *ngIf="subitem.badge">
                        {{ subitem.badge.text | translate }}
                      </span>
                    </a>
                  </li>
                </ul>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </ngx-simplebar>

  <!-- Footer del Sidebar -->
  <div class="sidebar-footer-status" aria-label="Estado del sistema">
    <span class="footer-sync-row"><i class="sync-dot"></i> Servidor sincronizado</span>
    <small class="version-tag-pill">v3.4.2</small>
  </div>
</div>
<!-- Left Sidebar End -->
