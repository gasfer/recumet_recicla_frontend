<header id="page-topbar">
    <div class="navbar-header">
      <div class="topbar-navigation">
        <button type="button" class="btn btn-sm px-3 font-size-16 header-item" id="vertical-menu-btn"
          [attr.aria-expanded]="mobileMenuOpen"
          [attr.aria-controls]="mobileMenuControls"
          [attr.aria-label]="mobileMenuOpen || !desktopSidebarHidden ? 'Ocultar menú de navegación' : 'Mostrar menú de navegación'"
          (click)="toggleMobileMenu($event)">
          <i class="fa fa-fw fa-bars"></i>
        </button>

      </div>

      <div class="topbar-actions d-flex align-items-center">
        <div class="work-context" [formGroup]="form">
          <div class="work-context__field">
            <label for="topbar-sucursal">Sucursal</label>
            <p-dropdown inputId="topbar-sucursal" [options]="sucursales()" styleClass="app-control-fluid"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
              (onClear)="setStoragesBySucursal()"
              (onChange)="setStoragesBySucursal()"
              [virtualScrollItemSize]="38" [lazy]="true"
              formControlName="id_sucursal"
            ></p-dropdown>
          </div>
          <div class="work-context__field">
            <label for="topbar-storage">Almacén</label>
            <p-dropdown inputId="topbar-storage" [options]="validatorsService.storages()" styleClass="app-control-fluid"
              appendTo="body"
              optionLabel="name"
              optionValue="id"
              placeholder="Almacén"
              (onChange)="setStorage()"
              [virtualScrollItemSize]="38" [lazy]="true"
              formControlName="id_storage"
            ></p-dropdown>
          </div>
        </div>

        <label class="global-search" aria-label="Búsqueda global">
          <span class="material-symbols-outlined">search</span>
          <input #globalSearch type="search" placeholder="Buscar compra, ticket o cliente">
          <kbd>Ctrl+K</kbd>
        </label>

        <div class="topbar-utilities d-flex align-items-center">
        <div class="topbar-search d-inline-block d-lg-none ms-2">
          <button aria-label="Buscar" type="button" class="btn header-item noti-icon" id="page-header-search-dropdown" data-bs-toggle="dropdown"
            aria-haspopup="true" aria-expanded="false">
            <i class="mdi mdi-magnify"></i>
          </button>
          <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"
            aria-labelledby="page-header-search-dropdown">
            <form class="p-3">
              <div class="m-0">
                <div class="input-group">
                  <input type="text" class="form-control" placeholder="Search ..." aria-label="Recipient's username">
                  <div class="input-group-append">
                    <button aria-label="Buscar" class="btn btn-primary" type="submit"><i class="mdi mdi-magnify"></i></button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>

        <div class="dropdown d-none d-lg-inline-block ms-1">
          <button type="button" class="btn header-item noti-icon" data-toggle="fullscreen" aria-label="Pantalla completa" (click)="fullscreen()">
            <i class="bx bx-fullscreen"></i>
          </button>
        </div>

        <!-- NOTIFICACIONES -->
        <div class="dropdown d-inline-block position-relative" [class.show]="notificationsDropdownOpen()">
          <button type="button"
                  class="btn header-item noti-icon"
                  id="page-header-notifications-dropdown"
                  aria-label="Abrir notificaciones"
                  [attr.aria-expanded]="notificationsDropdownOpen()"
                  (click)="toggleNotificationsDropdown($event)">
            <i class="bx bx-bell" [ngClass]="{'bx-tada text-danger': notificationsService.hasDangerAlert()}"></i>
            <span *ngIf="notificationsService.notifications().length > 0"
                  class="badge rounded-pill"
                  [ngClass]="notificationsService.hasDangerAlert() ? 'bg-danger' : 'bg-info'">
              {{ notificationsService.notifications().length }}
            </span>
          </button>
          <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0 notifications-dropdown-menu shadow-sm"
               [class.show]="notificationsDropdownOpen()"
               [style.display]="notificationsDropdownOpen() ? 'block' : 'none'"
               style="position: absolute; right: 0; top: 100%; min-width: 320px; z-index: 1050; margin-top: 2px;"
               aria-labelledby="page-header-notifications-dropdown">
            <div class="p-3 border-bottom">
              <div class="row align-items-center">
                <div class="col">
                  <h6 class="m-0 font-size-14 fw-bold">Notificaciones</h6>
                </div>
                <div class="col-auto" *ngIf="notificationsService.notifications().length > 0">
                  <a href="javascript:void(0);" class="small text-muted" (click)="markAllNotificationsAsRead()">Marcar leídas</a>
                </div>
              </div>
            </div>
            <ngx-simplebar class="notification-scroll" style="max-height: 280px;">
              <div *ngIf="notificationsService.notifications().length === 0" class="p-3 text-center text-muted">
                No tienes notificaciones pendientes.
              </div>
              <a href="javascript:void(0);"
                 class="text-reset notification-item d-block p-2 border-bottom"
                 *ngFor="let item of notificationsService.notifications()"
                 [ngClass]="{'bg-light-danger border-start border-danger border-4': item.level === 'DANGER'}">
                <div class="d-flex align-items-start">
                  <div class="avatar-xs me-2 mt-1">
                    <span class="avatar-title rounded-circle font-size-14"
                          [ngClass]="item.level === 'DANGER' ? 'bg-danger text-white' : 'bg-primary text-white'">
                      <i [ngClass]="item.level === 'DANGER' ? 'bx bx-error' : 'bx bx-transfer'"></i>
                    </span>
                  </div>
                  <div class="flex-grow-1 ms-1">
                    <h6 class="mb-1 font-size-13" [ngClass]="{'text-danger fw-bold': item.level === 'DANGER'}">
                      {{ item.title }}
                    </h6>
                    <div class="font-size-12 text-muted">
                      <p class="mb-1 text-wrap notification-message">{{ item.message }}</p>
                      <p class="mb-0 font-size-11"><i class="mdi mdi-clock-outline me-1"></i>{{ item.createdAt | date:'short' }}</p>
                    </div>
                  </div>
                </div>
              </a>
            </ngx-simplebar>
            <div class="p-2 border-top d-grid bg-light text-center">
              <a routerLink="/notifications" class="btn btn-sm btn-link font-size-13 text-primary fw-bold text-decoration-none" (click)="closeNotificationsDropdown()">
                <i class="bx bx-history me-1"></i> Ver todo el historial
              </a>
            </div>
          </div>
        </div>

        <!-- USUARIO / MI PERFIL -->
        <div class="dropdown d-inline-block position-relative" [class.show]="userDropdownOpen()">
          <button aria-label="Abrir menú de usuario"
                  type="button"
                  class="btn header-item"
                  id="page-header-user-dropdown"
                  [attr.aria-expanded]="userDropdownOpen()"
                  (click)="toggleUserDropdown($event)">
            <img class="rounded-circle header-profile-user"
                 [src]="authService.getUser.photo || defaultAvatar"
                 (error)="onImageError($event)"
                 alt="Header Avatar"
                 style="object-fit: cover;">
            <span class="d-none d-xl-inline-block ms-1">{{authService.getUser.full_names}} </span>
            <i class="mdi mdi-chevron-down d-none d-xl-inline-block" [class.rotate-180]="userDropdownOpen()"></i>
          </button>
          <div class="dropdown-menu dropdown-menu-end shadow-sm user-dropdown-menu"
               [class.show]="userDropdownOpen()"
               [style.display]="userDropdownOpen() ? 'block' : 'none'"
               style="position: absolute; right: 0; top: 100%; min-width: 180px; z-index: 1050; margin-top: 2px;">
            <a class="dropdown-item cursor-pointer py-2" routerLink="/profile" (click)="closeUserDropdown()">
              <i class="bx bx-user font-size-16 align-middle me-2 text-primary"></i>
              Mi Perfil
            </a>
            <div class="dropdown-divider my-1"></div>
            <a class="dropdown-item text-danger cursor-pointer py-2" (click)="logout()">
              <i class="bx bx-power-off font-size-16 align-middle me-2 text-danger"></i>
              {{ 'HEADER.LOGIN.LOGOUT' | translate}}
            </a>
          </div>
        </div>

        </div>
      </div>
    </div>
  </header>
